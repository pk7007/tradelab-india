name: Weekly public-source digest

on:
  workflow_dispatch:
    inputs:
      confirm_sources_reviewed:
        description: Confirm the source registry and repository readiness were reviewed
        required: true
        type: boolean
        default: false
  schedule:
    # Monday 03:30 UTC = approximately Monday 09:00 India Standard Time.
    - cron: "30 3 * * 1"

permissions:
  contents: write

jobs:
  digest:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_WEEKLY_DIGEST == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_sources_reviewed == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate digest and visible status
        run: python scripts/weekly_digest.py

      - name: Commit digest when files changed
        run: |
          if [[ -n "$(git status --porcelain updates)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates
            git commit -m "docs: update weekly public-source digest"
            git push
          else
            echo "No digest changes; no commit created."
          fi
