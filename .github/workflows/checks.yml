name: Offline application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install checking tools
        run: pip install -r requirements-dev.txt
      - name: Lint (defects only) and security scan
        run: |
          ruff check .
          bandit -q -r . -c pyproject.toml --severity-level high
      - name: Dependency audit (report only)
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile app.py paper.py evaluation.py trader_suite.py automation.py market_data.py research.py validation_lab.py scripts/weekly_digest.py scripts/paper_readiness.py
          python -m py_compile paper_worker.py worker_runtime.py broker_snapshot.py news_agent.py dashboard_news.py
          python -m py_compile syndication_transport.py integrated_news.py strategy_contract.py entry_review.py
          python -m py_compile announcements.py research_context.py syndication.py portal.py execution_journal.py intraday_contract.py intraday_evaluation.py market_contract.py evidence.py
          python -m py_compile strategy_lab.py scripts/batch_loss_audit.py scripts/cas_research_batch.py scripts/data_quality_audit.py scripts/render_batch_audit.py
          node --check web/evaluation.js
          node --check web/paper.js
          node --check web/account.js
          node --check web/app.js
          node --check web/market.js
          node --check web/automation.js
          node --check web/trader.js
          node --check web/portal.js
          node --check web/platform.js
          node --check web/workspace-tools.js
          node --check tests/news-labels.test.js
          python -m py_compile news_intelligence.py news_assessor.py indicators.py ema_adx_strategy.py
          python -m py_compile trade_workflow.py operational_alerts.py operations.py scripts/watch_service.py
          python -m py_compile agent_catalog.py agent_handlers.py agent_service.py auto_selector.py desk_coordinator.py experiment_registry.py
          python -m py_compile fundamental_research.py intraday_session.py nse_filings.py observed_forward.py session_evidence.py storage_ops.py
          python -m py_compile scripts/structure_check.py scripts/project_report.py
          python -m py_compile scripts/benchmark_agents.py scripts/check_intraday_ui.py scripts/check_research.py scripts/fixture_recovery.py scripts/loss_audit.py scripts/paper_research_batch.py
          python -m py_compile api_rate_limits.py broker_transport.py execution_controls.py market_observations.py transaction_costs.py
          python -m py_compile lineage_store.py entry_gate.py trading_calendar.py daily_pipeline.py arming.py
      - name: Account calculation regression tests
        run: |
          node tests/account.test.js
          node tests/order-review.test.js
          node tests/research-display.test.js
          node tests/portal-limits.test.js
          node tests/intraday-ui.test.js
          node tests/worker-ui.test.js
          node tests/session-ui.test.js
          node tests/news-time.test.js
          node tests/news-filters.test.js
          node tests/news-labels.test.js
      - name: Offline data and research tests
        run: python -m unittest discover -s tests -v
      - name: Paper fixture disconnect and process restart
        run: python scripts/fixture_recovery.py
      - name: Repository structure check
        run: python scripts/structure_check.py
      - name: Secret scan (gitleaks, full history)
        run: |
          VERSION=8.24.2
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .
